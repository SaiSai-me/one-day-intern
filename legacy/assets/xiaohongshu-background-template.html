<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一日实习生 · 小红书背景模板</title>
  <style>
    @font-face {
      font-family: "Zpix";
      src: url("https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@latest/dist/Zpix.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --blue: #2f6bff;
      --blue-deep: #0b2a6b;
      --sky: #7cc4ff;
      --paper: #f4f9ff;
      --yellow: #ffd23e;
      --green: #5dff8a;
      --ink: #0b2a6b;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      display: grid;
      place-items: center;
      min-width: 1120px;
      padding: 40px;
      color: var(--ink);
      background: #17224c;
      font-family: "Zpix", monospace;
    }

    /*
      小红书首图背景模板 · 1080 × 1440（3:4）
      导出提示：浏览器打开后使用“打印 / 保存为 PDF”或截图，保持 1080 × 1440 像素。
      可直接编辑：带 contenteditable="true" 的文字；替换中间占位图可放入自己的截图或人物照片。
    */
    .canvas {
      width: 1080px;
      height: 1440px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 91% 15%, rgba(124,196,255,.82) 0 4%, transparent 4.2%),
        linear-gradient(155deg, #c8e7ff 0%, #eaf6ff 42%, var(--paper) 100%);
    }

    .canvas::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      opacity: .53;
      background-image:
        linear-gradient(rgba(47,107,255,.14) 2px, transparent 2px),
        linear-gradient(90deg, rgba(47,107,255,.14) 2px, transparent 2px);
      background-size: 36px 36px;
    }

    .safe-area {
      position: absolute;
      z-index: 0;
      inset: 64px 62px 68px;
      pointer-events: none;
      border: 2px dashed rgba(11,42,107,.13);
    }

    .topbar {
      position: relative;
      z-index: 2;
      height: 118px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 52px;
      color: #fff;
      background: var(--blue-deep);
      border-bottom: 8px solid var(--yellow);
      font-size: 24px;
      letter-spacing: 2px;
    }

    .brand, .system { display: flex; align-items: center; gap: 16px; }
    .brand strong { color: var(--yellow); font-weight: inherit; }
    .led { width: 17px; height: 17px; background: var(--green); box-shadow: 0 0 0 4px #183b83; }
    .system { color: var(--sky); font-size: 20px; }

    .xp {
      position: absolute;
      left: 52px;
      right: 52px;
      bottom: 17px;
      height: 8px;
      background: rgba(255,255,255,.2);
    }
    .xp::after { content: ""; display: block; width: 63%; height: 100%; background: repeating-linear-gradient(90deg, var(--sky) 0 18px, var(--blue) 18px 27px); }

    .kicker {
      position: absolute;
      top: 169px;
      left: 72px;
      z-index: 2;
      display: inline-block;
      padding: 13px 22px;
      color: var(--blue-deep);
      background: var(--yellow);
      border: 5px solid var(--blue-deep);
      box-shadow: 9px 9px 0 var(--blue-deep);
      font-size: 27px;
      letter-spacing: 3px;
    }

    .copy {
      position: absolute;
      z-index: 2;
      top: 263px;
      left: 72px;
      width: 775px;
    }

    .copy h1 {
      margin: 0;
      color: var(--blue-deep);
      font-size: 89px;
      line-height: 1.2;
      letter-spacing: 4px;
      text-shadow: 7px 7px 0 var(--sky), 14px 14px 0 rgba(47,107,255,.22);
    }

    .copy .highlight { color: var(--blue); }
    .copy .subhead {
      display: inline-block;
      margin-top: 27px;
      padding: 10px 17px;
      color: var(--blue-deep);
      background: rgba(255,255,255,.8);
      border: 4px solid var(--blue-deep);
      box-shadow: 7px 7px 0 rgba(47,107,255,.32);
      font-family: var(--sans);
      font-size: 27px;
      font-weight: 750;
      line-height: 1.5;
    }

    .pixel-sun {
      position: absolute;
      z-index: 1;
      top: 198px;
      right: 67px;
      width: 152px;
      height: 152px;
      background: var(--yellow);
      box-shadow: 18px 0 0 #ffed9e, 0 18px 0 #ffed9e, -18px 0 0 #ffed9e, 0 -18px 0 #ffed9e;
    }
    .pixel-sun::after { content: "+"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--blue-deep); font-size: 68px; }

    .photo-frame {
      position: absolute;
      z-index: 2;
      top: 578px;
      left: 72px;
      width: 936px;
      height: 493px;
      overflow: hidden;
      background: #fff;
      border: 6px solid var(--blue-deep);
      box-shadow: 15px 15px 0 rgba(47,107,255,.42);
    }

    .photo-frame::before {
      content: "在这里放入产品截图、人物照片或信息图";
      position: absolute;
      z-index: 2;
      top: 50%; left: 50%;
      width: 590px;
      padding: 16px 18px;
      transform: translate(-50%, -50%);
      color: rgba(11,42,107,.62);
      border: 3px dashed rgba(11,42,107,.55);
      background: rgba(244,249,255,.82);
      font-family: var(--sans);
      font-size: 26px;
      font-weight: 700;
      text-align: center;
    }

    .photo-grid {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(124,196,255,.65), transparent 48%),
        linear-gradient(rgba(47,107,255,.08) 2px, transparent 2px),
        linear-gradient(90deg, rgba(47,107,255,.08) 2px, transparent 2px);
      background-size: auto, 30px 30px, 30px 30px;
    }

    .photo-grid::before, .photo-grid::after {
      content: "";
      position: absolute;
      background: var(--blue);
    }
    .photo-grid::before { width: 176px; height: 176px; right: 77px; bottom: -42px; box-shadow: -228px -112px 0 var(--yellow); }
    .photo-grid::after { width: 57px; height: 57px; left: 66px; bottom: 74px; background: var(--blue-deep); box-shadow: 76px 0 0 var(--sky), 0 -76px 0 var(--yellow); }

    .mission {
      position: absolute;
      z-index: 3;
      top: 1019px;
      left: 111px;
      padding: 10px 18px;
      color: #fff;
      background: var(--blue);
      border: 4px solid var(--blue-deep);
      box-shadow: 7px 7px 0 var(--blue-deep);
      font-size: 24px;
      letter-spacing: 2px;
    }

    .info-card {
      position: absolute;
      z-index: 2;
      top: 1118px;
      left: 72px;
      width: 936px;
      min-height: 185px;
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 28px 31px;
      background: #fff;
      border: 6px solid var(--blue-deep);
      box-shadow: 12px 12px 0 rgba(47,107,255,.35);
    }

    .number {
      width: 115px;
      height: 115px;
      display: grid;
      place-items: center;
      flex: none;
      color: var(--blue-deep);
      background: var(--yellow);
      border: 5px solid var(--blue-deep);
      font-size: 61px;
      box-shadow: 6px 6px 0 var(--sky);
    }
    .info-copy { padding-bottom: 2px; }
    .info-copy h2 { margin: 0 0 10px; color: var(--blue); font-size: 35px; letter-spacing: 2px; }
    .info-copy p { margin: 0; font-family: var(--sans); font-size: 25px; font-weight: 650; line-height: 1.55; }

    .bottom {
      position: absolute;
      z-index: 2;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 49px;
      color: var(--sky);
      background: var(--blue-deep);
      border-top: 6px solid var(--blue);
      font-size: 20px;
      letter-spacing: 2px;
    }
    .bottom b { color: var(--yellow); font-weight: inherit; }

    .stamp {
      position: absolute;
      z-index: 4;
      right: 70px;
      top: 1041px;
      width: 172px;
      height: 76px;
      display: grid;
      place-items: center;
      transform: rotate(-5deg);
      color: #fff;
      background: var(--blue-deep);
      border: 4px solid var(--yellow);
      box-shadow: 6px 6px 0 rgba(11,42,107,.28);
      font-size: 19px;
      letter-spacing: 1px;
    }

    [contenteditable="true"] { outline: none; cursor: text; }
    [contenteditable="true"]:focus { box-shadow: 0 0 0 5px rgba(47,107,255,.33); }

    @media print {
      @page { size: 1080px 1440px; margin: 0; }
      body { min-width: 0; padding: 0; background: #fff; }
      .canvas { break-after: avoid; }
      .safe-area { display: none; }
    }
  </style>
</head>
<body>
  <main class="canvas" aria-label="一日实习生小红书首图背景模板">
    <div class="safe-area" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand"><span class="led" aria-hidden="true"></span><span><strong>ONE-DAY</strong> INTERN</span></div>
      <div class="system">STATUS · ONLINE</div>
      <div class="xp" aria-hidden="true"></div>
    </header>

    <div class="kicker" contenteditable="true">SIDE QUEST · 实习攻略</div>
    <div class="copy">
      <h1 contenteditable="true">把<span class="highlight">实习</span><br>玩成一场游戏</h1>
      <p class="subhead" contenteditable="true">一篇讲清：AI 如何陪你体验真实的<br>产品经理工作日</p>
    </div>
    <div class="pixel-sun" aria-hidden="true"></div>

    <!-- 将 .photo-grid 替换为你的 <img>，即可放入产品截图或人物照片。 -->
    <section class="photo-frame" aria-label="主视觉素材占位区">
      <div class="photo-grid" aria-hidden="true"></div>
    </section>

    <div class="mission" contenteditable="true">▶ TODAY'S MISSION</div>
    <div class="stamp" contenteditable="true">NEW<br>CHECKPOINT</div>

    <section class="info-card">
      <div class="number" contenteditable="true">01</div>
      <div class="info-copy">
        <h2 contenteditable="true">不用真的入职，也能体验上班</h2>
        <p contenteditable="true">从接需求、开会到下班写实习日记，<br>一天完成一条属于你的“职场任务链”。</p>
      </div>
    </section>

    <footer class="bottom">
      <span contenteditable="true">@ 一日实习生 · 产品体验实验室</span>
      <span><b contenteditable="true">01</b> / 01</span>
    </footer>
  </main>
</body>
</html>
