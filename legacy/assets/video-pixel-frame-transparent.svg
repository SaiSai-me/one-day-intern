<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <mask id="video-hole">
      <rect width="1080" height="1920" fill="white"/>
      <rect x="111" y="721" width="858" height="464" rx="25" fill="black"/>
    </mask>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe979"/>
      <stop offset=".64" stop-color="#ffd23e"/>
      <stop offset="1" stop-color="#f0bc22"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity=".2"/>
      <stop offset=".28" stop-color="white" stop-opacity="0"/>
      <stop offset="1" stop-color="#4087db" stop-opacity=".08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="32" stdDeviation="18" flood-color="#23538b" flood-opacity=".35"/>
    </filter>
  </defs>

  <g mask="url(#video-hole)">
    <image x="-1164" y="0" width="3409" height="1920" preserveAspectRatio="none" xlink:href="video-voxel-background.png"/>
    <rect width="1080" height="1920" fill="url(#light)" opacity=".13"/>
  </g>

  <g>
    <rect x="90" y="199" width="900" height="52" rx="10" fill="rgba(31,87,154,.4)"/>
    <rect x="90" y="190" width="900" height="52" rx="10" fill="rgba(255,255,255,.72)" stroke="white" stroke-width="6"/>
    <rect x="90" y="190" width="12" height="52" rx="10" fill="url(#shine)" stroke="white" stroke-width="6"/>
  </g>

  <g filter="url(#shadow)" mask="url(#video-hole)">
    <rect x="90" y="720" width="900" height="506" rx="44" fill="rgba(39,100,172,.34)"/>
    <rect x="90" y="710" width="900" height="506" rx="44" fill="#9fbce0"/>
    <rect x="90" y="700" width="900" height="506" rx="44" fill="white"/>
  </g>
  <rect x="111" y="721" width="858" height="464" rx="25" fill="none" stroke="rgba(255,255,255,.38)" stroke-width="3"/>
</svg>
