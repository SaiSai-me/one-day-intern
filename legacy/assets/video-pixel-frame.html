<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一日实习生 · 像素视频框</title>
  <style>
    @font-face {
      font-family: "Zpix";
      src: url("https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@latest/dist/Zpix.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --navy: #13396f;
      --navy-2: #225899;
      --blue: #2f6bff;
      --sky: #7cc4ff;
      --yellow: #ffd23e;
      --green: #5dff8a;
      --white: #f7fbff;
      --progress: 0%;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background: #4c91e8;
      font-family: "Zpix", "Microsoft YaHei", monospace;
    }

    /* Fixed 1080x1920 stage. It scales to fit the browser without changing layout. */
    .stage {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      color: var(--white);
      background: #57a0ed url("./video-voxel-background.png") center / cover no-repeat;
      transform-origin: center center;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .13;
      background: linear-gradient(180deg, rgba(255,255,255,.2), transparent 28%, rgba(64,135,219,.08));
    }

    .topbar {
      position: absolute;
      z-index: 5;
      top: 180px;
      left: 90px;
      right: 90px;
      height: 62px;
      padding: 0;
    }

    .brand-row {
      display: none;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 2px;
      font-size: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 18px;
      color: #17457f;
      background: rgba(255,255,255,.9);
      border: 4px solid #fff;
      border-radius: 8px;
      box-shadow: 0 7px 0 rgba(32, 90, 159, .42), 0 13px 22px rgba(28, 84, 151, .18);
    }
    .led {
      width: 14px;
      height: 14px;
      background: var(--yellow);
      box-shadow: 4px 4px 0 #c79a15;
    }
    .now {
      padding: 11px 17px;
      color: #245a98;
      background: rgba(255,255,255,.86);
      border: 4px solid #fff;
      border-radius: 8px;
      box-shadow: 0 7px 0 rgba(32, 90, 159, .42);
      font-size: 17px;
    }
    .now strong { color: #0b2a6b; font-weight: normal; }

    .timeline {
      position: absolute;
      inset: 0;
      height: 62px;
    }

    .track, .fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 52px;
      border: 6px solid #fff;
      border-radius: 10px;
    }
    .track {
      background: rgba(255,255,255,.72);
      box-shadow: 0 9px 0 rgba(31, 87, 154, .4), 0 16px 25px rgba(39, 99, 166, .22);
    }
    .fill {
      right: auto;
      width: var(--progress);
      min-width: 0;
      background: linear-gradient(180deg, #ffe979 0%, var(--yellow) 64%, #f0bc22 100%);
      box-shadow: inset 0 6px 0 rgba(255,255,255,.42), 0 5px 0 #c99513;
      transition: width .15s linear;
    }

    .chapters {
      display: none;
      position: absolute;
      inset: 0 0 8px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .chapter {
      position: absolute;
      left: calc(var(--at) * 100%);
      bottom: 0;
      width: 150px;
      transform: translateX(-50%);
      text-align: center;
      color: rgba(18, 61, 114, .62);
      font-size: 16px;
      text-shadow: 0 2px 0 rgba(255,255,255,.82);
      white-space: nowrap;
    }
    .chapter:first-child { transform: none; text-align: left; }
    .chapter:last-child { transform: translateX(-100%); text-align: right; }
    .chapter::after {
      content: "";
      display: block;
      width: 20px;
      height: 20px;
      margin: 10px auto 0;
      background: #bad3ef;
      border: 4px solid #fff;
      border-radius: 3px;
      box-shadow: 4px 5px 0 #628ec5;
    }
    .chapter:first-child::after { margin-left: 0; }
    .chapter:last-child::after { margin-right: 0; }
    .chapter.done, .chapter.active { color: #123d72; }
    .chapter.done::after { background: var(--yellow); border-color: var(--yellow); }
    .chapter.active { color: var(--yellow); }
    .chapter.active::after {
      background: var(--yellow);
      border-color: #fff0a7;
      box-shadow: 0 0 0 7px rgba(255, 228, 107, .38), 4px 5px 0 #c89413;
    }

    .video-shell {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 700px;
      width: 900px;
      height: 506px;
      padding: 10px;
      overflow: hidden;
      border: 11px solid rgba(255,255,255,.98);
      border-radius: 44px;
      background: #1a4b8c;
      transform: translateX(-50%);
      box-shadow:
        0 10px 0 #9fbce0,
        0 20px 0 rgba(39, 100, 172, .34),
        0 32px 58px rgba(35, 83, 139, .35);
    }
    .video-shell::before {
      content: "";
      position: absolute;
      z-index: 3;
      inset: 10px;
      pointer-events: none;
      border: 3px solid rgba(255,255,255,.38);
      border-radius: 25px;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 25px;
      background: #0b2a6b;
      object-fit: contain;
    }

    .empty {
      position: absolute;
      z-index: 2;
      inset: 10px;
      display: grid;
      place-items: center;
      border-radius: 25px;
      background:
        linear-gradient(180deg, rgba(124,196,255,.7), rgba(47,107,255,.68)),
        #5ba4ee;
      cursor: pointer;
    }
    .empty-box {
      width: 560px;
      padding: 30px;
      text-align: center;
      border: 5px solid rgba(255,255,255,.9);
      border-radius: 14px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 9px 0 rgba(30, 86, 154, .35), 0 18px 32px rgba(27,79,145,.2);
    }
    .empty-title { color: var(--yellow); font-size: 30px; letter-spacing: 3px; }
    .empty-tip { margin-top: 20px; color: #245a98; font-size: 18px; line-height: 1.8; }
    .empty.hidden { display: none; }

    .corner {
      position: absolute;
      z-index: 4;
      display: none;
    }
    .c1, .c2, .c3, .c4 { display: none; }

    .pixel {
      position: absolute;
      z-index: 1;
      width: 18px;
      height: 18px;
      background: var(--blue);
      display: none;
      box-shadow: 26px 0 var(--sky), 0 26px var(--yellow), 52px 26px var(--blue);
    }
    .p1 { left: 56px; top: 110px; }
    .p2 { right: 108px; bottom: 116px; transform: rotate(180deg); }

    .help {
      position: fixed;
      z-index: 20;
      right: 14px;
      bottom: 12px;
      padding: 8px 12px;
      color: #a9bfe5;
      background: rgba(0, 0, 0, .56);
      border-radius: 6px;
      font: 12px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .export {
      position: fixed;
      z-index: 20;
      left: 14px;
      bottom: 12px;
      padding: 10px 14px;
      color: #123d72;
      background: #ffd23e;
      border: 3px solid #fff;
      border-radius: 7px;
      box-shadow: 0 4px 0 #bd8c10;
      cursor: pointer;
      font: 14px "Zpix", "Microsoft YaHei", monospace;
    }
    .export:disabled { cursor: wait; filter: saturate(.35); }
    body.clean .help, body.clean .export { display: none; }
    input { display: none; }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="pixel p1"></div>
    <div class="pixel p2"></div>

    <header class="topbar">
      <div class="brand-row">
        <div class="brand"><i class="led"></i>ONE-DAY INTERN · 实习进度</div>
        <div class="now">NOW PLAYING · <strong id="currentLabel">准备上班</strong></div>
      </div>
      <div class="timeline">
        <div class="track"></div>
        <div class="fill"></div>
        <ol class="chapters" id="chapters"></ol>
      </div>
    </header>

    <div class="corner c1"></div><div class="corner c2"></div>
    <div class="corner c3"></div><div class="corner c4"></div>

    <section class="video-shell" aria-label="视频播放窗口">
      <video id="video" playsinline></video>
      <label class="empty" id="empty" for="picker">
        <span class="empty-box">
          <span class="empty-title">▶ 放入你的实习视频</span>
          <span class="empty-tip">点击选择本地视频<br>进度条会自动跟随播放时间</span>
        </span>
      </label>
      <input id="picker" type="file" accept="video/*">
    </section>
  </main>
  <button class="export" id="export" type="button">导出合成视频</button>
  <div class="help">点击画面选择视频 · 空格 播放/暂停 · ← → 快退/快进 · F 全屏 · R 重选</div>

  <script>
    /* 修改这里即可调整章节名称和它在视频中的出现位置（0 到 1）。 */
    const chapterData = [
      { label: "入职", at: 0 },
      { label: "接任务", at: 0.16 },
      { label: "写 PRD", at: 0.38 },
      { label: "需求评审", at: 0.63 },
      { label: "终审答辩", at: 0.82 },
      { label: "实习日记", at: 1 }
    ];

    const stage = document.querySelector("#stage");
    const video = document.querySelector("#video");
    const picker = document.querySelector("#picker");
    const empty = document.querySelector("#empty");
    const chapters = document.querySelector("#chapters");
    const currentLabel = document.querySelector("#currentLabel");
    const exportButton = document.querySelector("#export");
    const background = new Image();
    const frame = { x: 90, y: 700, width: 900, height: 506 };
    const canvasSize = { width: 1080, height: 1920 };
    let objectUrl = "";
    let audioContext;
    let audioDestination;
    let videoSource;

    chapterData.forEach((chapter) => {
      const item = document.createElement("li");
      item.className = "chapter";
      item.style.setProperty("--at", chapter.at);
      item.textContent = chapter.label;
      chapters.appendChild(item);
    });
    const chapterEls = [...chapters.children];

    function fitStage() {
      const scale = Math.min(innerWidth / 1080, innerHeight / 1920);
      stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    function setProgress(value) {
      const progress = Math.max(0, Math.min(1, value || 0));
      stage.style.setProperty("--progress", `${progress * 100}%`);
      let activeIndex = 0;
      chapterData.forEach((chapter, index) => {
        if (progress >= chapter.at) activeIndex = index;
      });
      chapterEls.forEach((el, index) => {
        el.classList.toggle("done", index < activeIndex);
        el.classList.toggle("active", index === activeIndex);
      });
      currentLabel.textContent = chapterData[activeIndex].label;
    }

    function roundedRect(context, x, y, width, height, radius) {
      const safeRadius = Math.min(radius, width / 2, height / 2);
      context.beginPath();
      context.moveTo(x + safeRadius, y);
      context.arcTo(x + width, y, x + width, y + height, safeRadius);
      context.arcTo(x + width, y + height, x, y + height, safeRadius);
      context.arcTo(x, y + height, x, y, safeRadius);
      context.arcTo(x, y, x + width, y, safeRadius);
      context.closePath();
    }

    function drawCover(context, source, x, y, width, height) {
      const scale = Math.max(width / source.videoWidth, height / source.videoHeight);
      const drawWidth = source.videoWidth * scale;
      const drawHeight = source.videoHeight * scale;
      context.drawImage(source, x + (width - drawWidth) / 2, y + (height - drawHeight) / 2, drawWidth, drawHeight);
    }

    function drawContain(context, source, x, y, width, height) {
      const scale = Math.min(width / source.videoWidth, height / source.videoHeight);
      const drawWidth = source.videoWidth * scale;
      const drawHeight = source.videoHeight * scale;
      context.drawImage(source, x + (width - drawWidth) / 2, y + (height - drawHeight) / 2, drawWidth, drawHeight);
    }

    function drawComposite(context) {
      context.clearRect(0, 0, canvasSize.width, canvasSize.height);
      drawCover(context, background, 0, 0, canvasSize.width, canvasSize.height);

      const overlay = context.createLinearGradient(0, 0, 0, canvasSize.height);
      overlay.addColorStop(0, "rgba(255,255,255,.03)");
      overlay.addColorStop(.28, "rgba(255,255,255,0)");
      overlay.addColorStop(1, "rgba(64,135,219,.01)");
      context.fillStyle = overlay;
      context.fillRect(0, 0, canvasSize.width, canvasSize.height);

      const timelineX = 90;
      const timelineY = 190;
      const timelineWidth = 900;
      const progress = Math.max(0, Math.min(1, video.currentTime / video.duration || 0));
      roundedRect(context, timelineX, timelineY + 9, timelineWidth, 52, 10);
      context.fillStyle = "rgba(31,87,154,.4)";
      context.fill();
      roundedRect(context, timelineX, timelineY, timelineWidth, 52, 10);
      context.fillStyle = "rgba(255,255,255,.72)";
      context.fill();
      context.lineWidth = 6;
      context.strokeStyle = "#fff";
      context.stroke();
      if (progress > 0) {
        const fillWidth = Math.max(12, timelineWidth * progress);
        roundedRect(context, timelineX, timelineY, fillWidth, 52, 10);
        const fill = context.createLinearGradient(0, timelineY, 0, timelineY + 52);
        fill.addColorStop(0, "#ffe979");
        fill.addColorStop(.64, "#ffd23e");
        fill.addColorStop(1, "#f0bc22");
        context.fillStyle = fill;
        context.fill();
        context.strokeStyle = "#fff";
        context.stroke();
      }

      roundedRect(context, frame.x, frame.y + 20, frame.width, frame.height, 44);
      context.fillStyle = "rgba(39,100,172,.34)";
      context.fill();
      roundedRect(context, frame.x, frame.y + 10, frame.width, frame.height, 44);
      context.fillStyle = "#9fbce0";
      context.fill();
      roundedRect(context, frame.x, frame.y, frame.width, frame.height, 44);
      context.fillStyle = "rgba(255,255,255,.98)";
      context.fill();
      roundedRect(context, frame.x + 11, frame.y + 11, frame.width - 22, frame.height - 22, 30);
      context.fillStyle = "#1a4b8c";
      context.fill();

      const videoX = frame.x + 21;
      const videoY = frame.y + 21;
      const videoWidth = frame.width - 42;
      const videoHeight = frame.height - 42;
      roundedRect(context, videoX, videoY, videoWidth, videoHeight, 17);
      context.save();
      context.clip();
      context.fillStyle = "#0b2a6b";
      context.fillRect(videoX, videoY, videoWidth, videoHeight);
      drawContain(context, video, videoX, videoY, videoWidth, videoHeight);
      context.restore();
      roundedRect(context, videoX, videoY, videoWidth, videoHeight, 17);
      context.lineWidth = 3;
      context.strokeStyle = "rgba(255,255,255,.38)";
      context.stroke();
    }

    function waitForSeek() {
      return new Promise((resolve) => video.addEventListener("seeked", resolve, { once: true }));
    }

    async function exportComposite() {
      if (!video.src || !Number.isFinite(video.duration)) {
        alert("请先选择一个可播放的视频。");
        return;
      }
      if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
        alert("当前浏览器不支持视频导出，请使用最新版 Chrome 或 Edge。");
        return;
      }

      exportButton.disabled = true;
      exportButton.textContent = "正在导出…";
      try {
        await background.decode();
        video.pause();
        const seeked = waitForSeek();
        video.currentTime = 0;
        await seeked;

        const canvas = document.createElement("canvas");
        canvas.width = canvasSize.width;
        canvas.height = canvasSize.height;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("无法创建视频画布");

        if (!audioContext) {
          audioContext = new AudioContext();
          audioDestination = audioContext.createMediaStreamDestination();
          videoSource = audioContext.createMediaElementSource(video);
          videoSource.connect(audioDestination);
          videoSource.connect(audioContext.destination);
        }
        await audioContext.resume();

        const canvasStream = canvas.captureStream(30);
        const stream = new MediaStream([
          ...canvasStream.getVideoTracks(),
          ...audioDestination.stream.getAudioTracks()
        ]);
        const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
          ? "video/webm;codecs=vp9,opus"
          : "video/webm";
        const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });
        const chunks = [];
        recorder.addEventListener("dataavailable", (event) => {
          if (event.data.size) chunks.push(event.data);
        });

        const finished = new Promise((resolve) => recorder.addEventListener("stop", resolve, { once: true }));
        let animationFrame;
        const render = () => {
          drawComposite(context);
          if (video.ended) recorder.stop();
          else animationFrame = requestAnimationFrame(render);
        };
        recorder.addEventListener("stop", () => cancelAnimationFrame(animationFrame), { once: true });
        recorder.start();
        render();
        await video.play();
        await finished;

        const downloadUrl = URL.createObjectURL(new Blob(chunks, { type: mimeType }));
        const link = document.createElement("a");
        link.href = downloadUrl;
        link.download = "一日实习生-合成视频.webm";
        link.click();
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
      } catch (error) {
        console.error(error);
        alert("导出失败，请确认视频格式可在浏览器中播放后重试。");
      } finally {
        exportButton.disabled = false;
        exportButton.textContent = "导出合成视频";
      }
    }

    picker.addEventListener("change", () => {
      const file = picker.files[0];
      if (!file) return;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      video.src = objectUrl;
      empty.classList.add("hidden");
      video.play();
    });

    video.addEventListener("timeupdate", () => setProgress(video.currentTime / video.duration));
    video.addEventListener("loadedmetadata", () => setProgress(0));
    video.addEventListener("ended", () => setProgress(1));
    exportButton.addEventListener("click", exportComposite);

    addEventListener("resize", fitStage);
    addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        video.paused ? video.play() : video.pause();
      }
      if (event.key === "ArrowLeft") video.currentTime = Math.max(0, video.currentTime - 5);
      if (event.key === "ArrowRight") video.currentTime = Math.min(video.duration || 0, video.currentTime + 5);
      if (event.key.toLowerCase() === "f") document.documentElement.requestFullscreen?.();
      if (event.key.toLowerCase() === "r") picker.click();
    });

    if (new URLSearchParams(location.search).has("clean")) document.body.classList.add("clean");
    background.src = "./video-voxel-background.png";
    fitStage();
    setProgress(0);
  </script>
</body>
</html>
