<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{player_name}} 的实习日记 · {{company}}</title>
<style>
  @font-face { font-family:'Zpix'; src: local('Zpix'); }
  :root{
    --ink:#0b2a6b; --blue:#2f6bff; --sky:#7cc4ff; --yellow:#ffd23e;
    --red:#ff5d5d; --green:#19b551; --paper:#f4f9ff; --white:#ffffff;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:'Zpix','Press Start 2P',monospace;
    background: var(--paper);
    background-image: linear-gradient(var(--sky) 1px, transparent 1px), linear-gradient(90deg, var(--sky) 1px, transparent 1px);
    background-size: 24px 24px; background-position:-1px -1px;
    color: var(--ink); display:flex; justify-content:center; padding:32px 16px;
  }
  .card{
    width:100%; max-width:560px; background:var(--white);
    border:4px solid var(--ink); box-shadow:8px 8px 0 var(--ink); padding:28px;
  }
  .badge{
    display:inline-block; background:var(--yellow); border:3px solid var(--ink);
    padding:4px 10px; font-size:12px; box-shadow:3px 3px 0 var(--ink); margin-bottom:14px;
  }
  h1{ font-size:22px; line-height:1.5; margin-bottom:4px; }
  .meta{ font-size:12px; color:var(--blue); margin-bottom:20px; }
  .stats{ display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap; }
  .stat{
    flex:1; min-width:130px; border:3px solid var(--ink); padding:10px;
    text-align:center; box-shadow:4px 4px 0 var(--ink);
  }
  .stat b{ display:block; font-size:22px; margin-bottom:4px; }
  .stat:nth-child(1) b{ color:var(--green); } .stat:nth-child(2) b{ color:var(--red); } .stat:nth-child(3) b{ color:var(--blue); }
  .stat span{ font-size:11px; }
  h2{
    font-size:14px; background:var(--blue); color:var(--white); display:inline-block;
    padding:5px 10px; border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink); margin-bottom:12px;
  }
  .highlights{ list-style:none; margin-bottom:22px; }
  .highlights li{
    font-size:13px; line-height:1.7; border-left:6px solid var(--yellow);
    background:var(--paper); padding:8px 12px; margin-bottom:8px; border:2px solid var(--ink); border-left-width:6px;
  }
  .ending{
    border:3px dashed var(--ink); background:#fff8e0; padding:14px;
    font-size:13px; line-height:1.9; margin-bottom:22px;
  }
  .footer{ font-size:10px; text-align:center; color:var(--blue); line-height:1.8; }
  .footer .logo{ color:var(--ink); }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">📋 实习证明 · NO.{{run_id}}</div>
    <h1>{{player_name}} 的一日实习日记</h1>
    <div class="meta">{{date}} · {{company}} · {{role}}</div>

    <div class="stats">
      <div class="stat"><b>{{stats_tasks}}</b><span>完成任务</span></div>
      <div class="stat"><b>{{stats_fights}}</b><span>职场吵架</span></div>
      <div class="stat"><b>{{stats_slack}}</b><span>摸鱼指数</span></div>
    </div>

    <h2>▶ 今日名场面</h2>
    <ul class="highlights">
      {{highlights}}
    </ul>

    <h2>▶ HR 结业评语</h2>
    <div class="ending">{{ending}}</div>

    <div class="footer">
      <div class="logo">■ 一日实习生 One-Day Intern ■</div>
      本日记由 AI 根据真实行为日志生成 · 想体验这份实习?搜索实习包「{{pack_id}}」
    </div>
  </div>
</body>
</html>
