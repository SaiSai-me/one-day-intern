name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '' || format('/{0}', github.event.repository.name) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test Codex Skill runtime
        run: python3 -m unittest discover -s .agents/skills/one-day-intern/tests -v
      - name: Validate Codex Skill release
        run: |
          python3 .agents/skills/one-day-intern/scripts/validate-skill.py \
            .agents/skills/one-day-intern \
            --release-zip dist/codex/one-day-intern-codex-v0.6.0.zip
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev
      - name: Build static site
        working-directory: web
        run: npm run build
      - name: Verify published Skill package
        run: cmp dist/codex/one-day-intern-codex-v0.6.0.zip web/out/one-day-intern-codex-v0.6.0.zip
      - name: Disable Jekyll processing
        run: touch web/out/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
